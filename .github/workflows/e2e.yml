name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Shared package tests
        run: pnpm test:shared

      - name: Unit and API regression tests
        run: pnpm test:unit

      - name: Start isolated Supabase
        run: pnpm exec supabase start

      - name: Export local Supabase credentials
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          ANON_VALUE="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE_VALUE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          test -n "$API_URL"
          test -n "$ANON_VALUE"
          test -n "$SERVICE_VALUE"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_VALUE"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_VALUE"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm exec playwright test --reporter=list

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
